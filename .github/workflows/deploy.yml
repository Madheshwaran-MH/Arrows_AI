name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_APP_ENV: production
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      VITE_API_URL: http://172.174.201.208:8080
      VITE_MS_TENANT_ID: common
      VITE_MS_REDIRECT_URI: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      VITE_MS_GRAPH_SCOPES: User.Read,Calendars.Read
      VITE_SUPERSET_URL: http://172.174.201.208:8088
      VITE_SUPERSET_EMBED_ID: 9b7611d5-1174-40d4-a577-9d5631d281a1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
